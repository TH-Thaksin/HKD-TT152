<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VNPT HKD Academy — Nghiệp vụ Kế toán</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFBF9;
  --paper-2:#F1F5F2;
  --card:#FFFFFF;
  --ink:#14211B;
  --ink-soft:#3E4A42;
  --ink-faint:#7C897F;
  --rule:#DCE8DF;
  --rule-strong:#BBD3C2;
  --green:#0F7A4E;
  --green-deep:#0B5C3B;
  --green-soft:#E3F0E8;
  --seal:#A3271E;
  --seal-soft:#F5DEDA;
  --font-body:'Be Vietnam Pro',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.6;
}
::selection{background:#CDEBD9;}
button,input{font-family:inherit;}

/* ===== TOPBAR ===== */
.topbar{
  background:var(--ink);
  color:var(--paper);
  padding:16px 32px 0;
}
.topbar-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:14px;
  padding-bottom:14px;
  border-bottom:1px solid rgba(255,255,255,0.14);
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .mark{font-weight:800;font-size:21px;letter-spacing:0.2px;}
.brand .sub{
  font-size:11px;color:#9FCBB0;letter-spacing:1.4px;
  text-transform:uppercase;font-family:var(--font-mono);
}
.doc-meta{
  font-family:var(--font-mono);font-size:11px;color:#7E9A8C;
  padding:7px 0 9px;display:flex;gap:20px;flex-wrap:wrap;
}
.doc-meta b{color:#CFE9DA;font-weight:600;}
.mode-switch{
  display:flex;background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.16);border-radius:8px;padding:3px;gap:3px;
}
.mode-switch button{
  border:none;background:transparent;color:#B9C7BF;
  font-weight:600;font-size:12.5px;padding:9px 16px;border-radius:6px;
  cursor:pointer;transition:all .15s ease;display:flex;align-items:center;gap:7px;
}
.mode-switch button .ic{width:7px;height:7px;border-radius:2px;background:currentColor;flex:none;}
.mode-switch button.active.gv{background:var(--green-deep);color:#EAF5EE;}
.mode-switch button.active.dtv{background:var(--green);color:#EAF5EE;}

/* ===== SEAL BANNER ===== */
.seal-banner{
  background:var(--seal-soft);border-bottom:1px solid #E3B9B2;
  padding:10px 32px;font-size:13px;color:#6B1D15;font-weight:500;
  display:flex;align-items:center;gap:12px;
}
.stamp{
  font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:var(--seal);
  border:1.5px solid var(--seal);border-radius:4px;padding:3px 8px;
  transform:rotate(-2deg);letter-spacing:1px;flex:none;background:#fff;
}

/* ===== LAYOUT ===== */
.layout{
  display:grid;grid-template-columns:240px 1fr;
  max-width:1220px;margin:0 auto;min-height:70vh;
}
.rail{padding:26px 0 40px;border-right:1px solid var(--rule);position:relative;}
.rail-title{
  font-family:var(--font-mono);font-size:11px;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--ink-faint);padding:0 22px 10px;
}
.tab{
  display:block;width:100%;text-align:left;background:none;border:none;
  border-left:3px solid transparent;padding:11px 20px;font-size:14px;font-weight:500;
  color:var(--ink-soft);cursor:pointer;display:flex;gap:10px;align-items:flex-start;line-height:1.35;
}
.tab .num{
  font-family:var(--font-mono);font-weight:700;color:var(--green);font-size:13px;
  width:16px;flex:none;
}
.tab:hover{background:var(--paper-2);}
.tab.active{background:var(--card);border-left-color:var(--green);color:var(--ink);font-weight:700;}

.rail-search{position:relative;margin:0 20px 18px;}
.rail-search input{
  width:100%;border:1px solid var(--rule-strong);background:var(--card);
  border-radius:7px;padding:10px 12px;font-size:13px;color:var(--ink);
}
.rail-search input:focus{outline:2px solid var(--green);outline-offset:1px;}
.search-results{
  position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--card);
  border:1px solid var(--rule-strong);border-radius:8px;
  box-shadow:0 10px 24px rgba(20,33,27,0.14);max-height:360px;overflow-y:auto;
  z-index:30;display:none;
}
.search-results.show{display:block;}
.search-result-item{padding:10px 12px;border-bottom:1px solid var(--rule);cursor:pointer;}
.search-result-item:last-child{border-bottom:none;}
.search-result-item:hover{background:var(--green-soft);}
.search-result-item .srm{
  font-family:var(--font-mono);font-size:10px;text-transform:uppercase;
  color:var(--green-deep);letter-spacing:.5px;margin-bottom:3px;font-weight:600;
}
.search-result-item .srs{font-size:12.5px;color:var(--ink);}
.search-result-item mark{background:#CDEBD9;color:var(--ink);padding:0 1px;border-radius:2px;}
.search-empty{padding:14px;font-size:12.5px;color:var(--ink-faint);font-style:italic;}

.content{padding:32px 40px 60px;}

/* ===== HEADERS ===== */
.module-head{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--rule);}
.module-eyebrow{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:1px;color:var(--green-deep);
  text-transform:uppercase;margin-bottom:6px;font-weight:600;
}
.module-title{font-size:25px;font-weight:800;margin:0 0 8px;letter-spacing:-0.2px;}
.module-goal{color:var(--ink-soft);font-size:14px;margin:0;}

.gv-note{
  display:none;background:var(--green-soft);border:1px solid #BFE0CC;
  border-left:4px solid var(--green);border-radius:0 8px 8px 0;
  padding:14px 16px;margin:16px 0;
}
body.mode-gv .gv-note{display:block;}
.gv-note .gv-head{
  font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;
  letter-spacing:1px;color:var(--green-deep);font-weight:700;margin-bottom:10px;
}
.gv-row{font-size:13px;margin-bottom:9px;color:#1E3226;}
.gv-row:last-child{margin-bottom:0;}
.gv-row b{
  font-family:var(--font-mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--green-deep);display:block;margin-bottom:2px;font-weight:700;
}

section.block{margin-bottom:28px;scroll-margin-top:20px;}
.block h3{font-size:16.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;font-weight:700;}
.block h3::before{content:'';width:8px;height:8px;background:var(--green);border-radius:2px;flex:none;}
.card{
  background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--green);
  border-radius:6px;padding:14px 16px;margin-bottom:10px;
}
.card p{margin:0 0 8px;font-size:14px;}
.card p:last-child{margin-bottom:0;}
.card strong{color:var(--ink);}

.attitude-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:600px){.attitude-grid{grid-template-columns:1fr;}}
.attitude-col{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;}
.attitude-col.good{border-left:4px solid var(--green);}
.attitude-col.bad{border-left:4px solid var(--seal);}
.attitude-col h5{
  margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
  font-family:var(--font-mono);font-weight:700;
}
.attitude-col.good h5{color:var(--green-deep);}
.attitude-col.bad h5{color:var(--seal);}
.attitude-col ul{margin:0;padding-left:18px;font-size:13.5px;}
.attitude-col li{margin-bottom:6px;}

.reftable-wrap{overflow-x:auto;margin-bottom:14px;border-left:3px double var(--green);border-radius:0 var(--radius) var(--radius) 0;}
table.reftable{width:100%;border-collapse:collapse;background:var(--card);font-size:13.5px;}
table.reftable th{
  background:var(--green-soft);text-align:left;padding:10px 14px;
  font-family:var(--font-mono);font-weight:700;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.4px;color:var(--green-deep);border-bottom:2px solid var(--rule-strong);
}
table.reftable td{padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:top;}
table.reftable tr:nth-child(even) td{background:#FAFCFA;}
table.reftable tr:last-child td{border-bottom:none;}
table.reftable td.num{font-family:var(--font-mono);text-align:right;}

/* ===== ERROR LOOKUP (Module 4) ===== */
.err-search{display:flex;gap:10px;margin-bottom:18px;}
.err-search input{
  flex:1;border:1px solid var(--rule-strong);background:var(--card);border-radius:7px;
  padding:12px 16px;font-size:14px;
}
.err-search input:focus{outline:2px solid var(--green);outline-offset:1px;}
.err-count{font-size:12.5px;color:var(--ink-faint);margin:-8px 0 14px;font-family:var(--font-mono);}
.err-card{
  background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--seal);
  border-radius:0 var(--radius) var(--radius) 0;padding:16px 18px;margin-bottom:14px;
  scroll-margin-top:20px;
}
.err-card .tag{
  display:inline-block;font-family:var(--font-mono);font-size:10.5px;font-weight:700;
  letter-spacing:.5px;border:1.5px solid var(--seal);color:var(--seal);padding:2px 8px;
  border-radius:3px;margin-bottom:9px;text-transform:uppercase;background:#fff;
}
.err-card h4{margin:0 0 8px;font-size:15.5px;font-weight:700;}
.err-card .lbl{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);
  font-family:var(--font-mono);margin:10px 0 4px;font-weight:600;
}
.err-card ul{margin:0;padding-left:18px;font-size:14px;}
.err-card li{margin-bottom:4px;}
.no-result{text-align:center;color:var(--ink-faint);padding:30px;font-style:italic;}
.err-filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.err-filter-btn{
  font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.3px;
  border:1px solid var(--rule-strong);background:var(--card);color:var(--ink-soft);
  padding:6px 12px;border-radius:16px;cursor:pointer;transition:all .15s ease;
}
.err-filter-btn:hover{background:var(--paper-2);}
.err-filter-btn.active{background:var(--green-deep);border-color:var(--green-deep);color:#EAF5EE;}
.err-card ol{margin:0;padding-left:20px;font-size:14px;}
.err-card ol li{margin-bottom:5px;}
.err-images{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
.err-images img{
  max-width:280px;width:100%;border:1px solid var(--rule-strong);border-radius:6px;
  display:block;box-shadow:0 2px 6px rgba(20,33,27,0.08);
}
@media (max-width:600px){.err-images img{max-width:100%;}}

/* ===== CALL SCRIPT (Module 5) ===== */
.call-step{
  display:flex;gap:16px;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;align-items:flex-start;
  scroll-margin-top:20px;
}
.call-step input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--green);flex:none;}
.call-step .step-num{
  font-family:var(--font-mono);font-weight:700;color:var(--green);font-size:19px;flex:none;width:22px;
}
.call-step h4{margin:0 0 5px;font-size:15px;font-weight:700;}
.call-step p{margin:0;font-size:13.5px;color:var(--ink-soft);}
.call-step .example{
  margin-top:8px;background:var(--green-soft);color:var(--green-deep);
  padding:8px 12px;border-radius:6px;font-size:13px;font-family:var(--font-mono);
}
.attitude-title{font-size:16.5px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:8px;}
.attitude-title::before{content:'';width:8px;height:8px;background:var(--green);border-radius:2px;flex:none;}

/* ===== QUIZ (Module 6) ===== */
.quiz-q{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:14px;scroll-margin-top:20px;
}
.quiz-q p.qtext{font-weight:700;margin:0 0 10px;font-size:14.5px;}
.quiz-q label{
  display:block;padding:8px 12px;border:1px solid var(--rule);border-radius:7px;
  margin-bottom:7px;font-size:13.5px;cursor:pointer;
}
.quiz-q label:hover{background:var(--paper-2);}
.quiz-q input{margin-right:8px;}
.quiz-result{
  display:none;background:var(--green-soft);color:var(--green-deep);padding:14px 18px;
  border-radius:var(--radius);font-weight:700;margin-top:8px;
}
.btn{
  background:var(--ink);color:var(--paper);border:none;padding:11px 22px;border-radius:7px;
  font-weight:700;font-size:13.5px;cursor:pointer;
}
.btn:hover{background:#0A140F;}

.flash{animation:flashbg 1.6s ease;}
@keyframes flashbg{0%{background:#CDEBD9;}100%{background:inherit;}}

@media (max-width:820px){
  .layout{grid-template-columns:1fr;}
  .rail{border-right:none;border-bottom:1px solid var(--rule);padding:18px 0;}
  .content{padding:24px 20px 50px;}
  .topbar{padding:14px 18px 0;}
  .seal-banner{padding:10px 18px;}
}
</style>
</head>
<body class="mode-dtv">

<div class="topbar">
  <div class="topbar-main">
    <div class="brand">
      <span class="mark">VNPT HKD Academy</span>
      <span class="sub">Nghiệp vụ kế toán</span>
    </div>
    <div class="mode-switch">
      <button class="gv" id="btn-gv" onclick="setMode('gv')"><span class="ic"></span>Giảng dạy (GV)</button>
      <button class="active dtv" id="btn-dtv" onclick="setMode('dtv')"><span class="ic"></span>Tra cứu (ĐTV)</button>
    </div>
  </div>
  <div class="doc-meta">
    <span>Mã tài liệu: <b>VNPT-HKD-KT.01</b></span>
    <span>Phiên bản: <b>2026.1</b></span>
    <span>Cập nhật: <b>22/07/2026</b></span>
  </div>
</div>
<div class="seal-banner">
  <span class="stamp">TT 152/2025</span>
  Thông tư 152/2025/TT-BTC — hiệu lực từ 01/01/2026, thay thế hoàn toàn Thông tư 88/2021/TT-BTC
</div>

<div class="layout">
  <div class="rail">
    <div class="rail-search">
      <input type="text" id="global-search" placeholder="Tìm nhanh: lỗi, mẫu sổ, quy trình…" oninput="onGlobalSearchInput(this.value)" autocomplete="off">
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="rail-title">6 module đào tạo</div>
    <button class="tab active" data-m="m1" onclick="showModule('m1')"><span class="num">I</span> Nền tảng pháp lý</button>
    <button class="tab" data-m="m2" onclick="showModule('m2')"><span class="num">II</span> Tổng quan nghiệp vụ</button>
    <button class="tab" data-m="m3" onclick="showModule('m3')"><span class="num">III</span> Hướng dẫn thao tác</button>
    <button class="tab" data-m="m4" onclick="showModule('m4')"><span class="num">IV</span> Lỗi thường gặp</button>
    <button class="tab" data-m="m5" onclick="showModule('m5')"><span class="num">V</span> Kịch bản cuộc gọi</button>
    <button class="tab" data-m="m6" onclick="showModule('m6')"><span class="num">VI</span> Kiểm tra & tổng kết</button>
  </div>

  <div class="content" id="content"></div>
</div>

<script>
const DATA = {
m1:{
  eyebrow:"Module I",
  title:"Nền tảng pháp lý — TT 152/2025/TT-BTC",
  goal:"ĐTV nắm rõ nội dung cốt lõi của Thông tư 152/2025/TT-BTC để giải thích cho khách hàng",
  gv:{
    giang:"Nhấn mạnh ranh giới trước/sau 01/01/2026: trước đây thuế khoán ấn định cố định theo tháng, nay HKD tự kê khai theo sổ sách thực tế — đây là thay đổi tư duy lớn nhất khách hàng cần hiểu.",
    hoi:"Vì sao Nhà nước chọn nguyên tắc \"thuế quản lý đến đâu, mở sổ đến đó\" thay vì bắt tất cả HKD mở đủ 7 loại sổ?",
    thuchanh:"Phát 4 hồ sơ khách hàng khác nhau (bán lẻ không hóa đơn, dịch vụ có hóa đơn, hộ có hàng tồn kho, hộ chịu thêm thuế TTĐB) — yêu cầu học viên xác định đúng mẫu sổ áp dụng cho từng hồ sơ."
  },
  blocks:[
    {h:"Điểm cốt lõi", body:`
      <div class="card"><p><strong>Bãi bỏ thuế khoán:</strong> từ 01/01/2026, tất cả hộ kinh doanh phải tự kê khai, tự nộp thuế dựa trên sổ sách — không còn việc cơ quan thuế ấn định mức cố định hàng tháng.</p></div>
      <div class="card"><p><strong>Nguyên tắc mới:</strong> "Thuế quản lý đến đâu, mở sổ đến đó" — thay vì bắt buộc mọi HKD mở đủ 7 loại sổ phức tạp, nhằm giảm tối đa chi phí hành chính.</p></div>`},
    {h:"Bảng mẫu sổ sách theo đối tượng", body:`
      <div class="reftable-wrap"><table class="reftable">
      <tr><th>Đối tượng</th><th>Tên mẫu sổ</th></tr>
      <tr><td>Không chịu thuế GTGT, không nộp thuế TNCN</td><td>S1a-HKD (Sổ chi tiết doanh thu)</td></tr>
      <tr><td>Nộp thuế GTGT + TNCN theo % trên doanh thu</td><td>S2a-HKD (Sổ chi tiết doanh thu theo ngành nghề)</td></tr>
      <tr><td>Nộp GTGT theo % doanh thu và TNCN trên thu nhập tính thuế</td><td>S2b, S2c, S2d, S2e-HKD (Bộ sổ Kho, Chi phí, Lương, Tiền mặt/Tiền gửi)</td></tr>
      <tr><td>Chịu thêm thuế khác (TTĐB, tài nguyên, phí, lệ phí…)</td><td>S3a-HKD (Sổ theo dõi nghĩa vụ thuế khác)</td></tr>
      </table></div>`}
  ]
},
m2:{
  eyebrow:"Module II",
  title:"Tổng quan nghiệp vụ kế toán trên VNPT HKD",
  goal:"Hiểu tập hợp công việc ghi chép, xử lý chứng từ và báo cáo phục vụ kê khai thuế",
  gv:{
    giang:"Cho học viên tự vẽ sơ đồ 3 dòng nghiệp vụ (Doanh thu → Chi phí/Kho → Dòng tiền/Thuế) trước khi chiếu đáp án để tăng khả năng ghi nhớ.",
    hoi:"Một khách hàng chỉ xuất hóa đơn nhưng không bao giờ nhập chứng từ chi phí — báo cáo thuế của họ sẽ lệch theo hướng nào và vì sao?",
    thuchanh:"Đóng vai 3 vị trí (mua hàng, bán hàng, thủ kho) trong cùng một tình huống nhập-xuất hàng, để học viên tự phân biệt vai trò và chứng từ cốt lõi của từng vị trí."
  },
  blocks:[
    {h:"1. Quản lý doanh thu (đầu ra)", body:`
      <div class="card"><p>Xuất hóa đơn điện tử ngay khi giao hàng/cung cấp dịch vụ.</p></div>
      <div class="card"><p>Ghi nhận doanh thu vào <strong>Sổ doanh thu (S1a / S2a / S2b)</strong>.</p></div>
      <div class="card"><p>Phân loại doanh thu theo ngành nghề để áp đúng tỷ lệ % thuế suất.</p></div>`},
    {h:"2. Quản lý chi phí, vật tư và kho (đầu vào)", body:`
      <div class="card"><p>Kiểm tra tính hợp pháp của hóa đơn mua hàng, tiền thuê, điện, lương.</p></div>
      <div class="card"><p>Hạch toán chi phí vào <strong>Sổ chi tiết chi phí (S2c)</strong> để làm căn cứ giảm trừ thuế.</p></div>

    hoi:"Tại sao hệ thống bắt phải nhập kho trước rồi mới cho xuất bán, kể cả với hộ bán lẻ nhỏ?",
    thuchanh:"Cho học viên thực hành chuỗi thao tác đầy đủ: khai báo danh mục → nhập số dư đầu kỳ → lập phiếu nhập → lập chứng từ bán → chạy Tính lại giá vốn, trên một bộ dữ liệu mẫu."

  blocks:[
    {h:"Quy trình tổng thể", body:`
      <div class="card"><p>Thiết lập kế toán → Khai báo danh mục (khách hàng, NCC, nhóm hàng...) → Nhập số dư đầu kỳ → Hạch toán hàng ngày.</p></div>`},
    {h:"Bảng phân hệ nghiệp vụ", body:`
      <div class="reftable-wrap"><table class="reftable">
      <tr><th>Phân hệ</th><th>Quy trình chuẩn</th><th>Lưu ý cốt lõi</th></tr>
      <tr><td>Mua/Bán hàng</td><td>Lập chứng từ mua hàng (có hóa đơn); lập bảng kê mua hàng nếu không có hóa đơn; lập chứng từ bán hàng</td><td>Ngày chứng từ xuất kho bán hàng phải chuẩn xác, không lệch niên độ hoặc trong tương lai</td></tr>
      <tr><td>Tiền tệ & công nợ</td><td>Lập phiếu thu/chi tiền mặt và chuyển khoản; nghiệp vụ nội bộ (rút/nộp tiền)</td><td>Bắt buộc chọn đúng "Lý do thu/chi" để lên đúng sổ công nợ</td></tr>
      <tr><td>Tính giá vốn</td><td>Rà soát chứng từ mua/bán/nhập/xuất/thu/chi trong kỳ; vào chức năng Tính lại giá vốn</td><td>Thực hiện khi: xuất hàng xong mới nhập hàng; sửa/xóa chứng từ nhập xuất; trước khi báo cáo thuế</td></tr>
      </table></div>`},
    {h:"Kế toán kho — 4 phân hệ chức năng", body:`
      <div class="card"><p><strong>Kiểm kê kho:</strong> kiểm tra thực tế hàng tồn kho để xác định chính xác số lượng, chất lượng, giá trị và phát hiện chênh lệch so với sổ sách.</p></div>
      <div class="card"><p><strong>Nhập kho:</strong> ghi tăng kho cho các trường hợp như xử lý thiếu sau kiểm kê, nhận biếu tặng, khuyến mãi — ngoài các nghiệp vụ mua hàng thông thường.</p></div>
      <div class="card"><p><strong>Xuất kho:</strong> ghi giảm kho cho các trường hợp như xử lý thừa sau kiểm kê, giảm do thiên tai, từ thiện, mất, hủy — ngoài việc xuất bán hàng hóa.</p></div>
      <div class="card"><p><strong>Chuyển kho:</strong> ghi nhận và quản lý việc chuyển nguyên vật liệu nội bộ giữa các kho.</p></div>
      <div class="card"><p>4 chức năng này giúp quản lý chặt chẽ, minh bạch và chính xác hàng tồn kho, đảm bảo đồng bộ giữa sổ sách và thực tế.</p></div>`}
  ]
},

     opts:["Xóa toàn bộ chứng từ cũ và nhập lại từ đầu","Tắt nguồn máy tính và khởi động lại phần mềm","Truy cập menu Kế toán > Tiện ích > Chọn chức năng \"Tính lại giá vốn\"","Khai báo lại danh mục hàng hóa vật tư"], correct:2},
    {q:"Khi lập Phiếu thu tiền từ hoạt động bán hàng của khách nợ, lý do thu nào dưới đây bắt buộc phải chọn để hệ thống tự động cấn trừ và cập nhật đúng sổ công nợ phải thu?",
     opts:["Thu tiền tạm ứng của nhân viên","Thu tiền thanh toán hàng hóa, dịch vụ của KH trả sau","Thu khác bằng tiền mặt","Thu tiền vay, mượn từ cá nhân khác"], correct:1},
    {q:"Khi khách hàng thực hiện Tính lại giá vốn cuối kỳ và phần mềm báo lỗi: \"Unknown column 'Tongtien' in field list\", nguyên nhân thường do đâu?",
     opts:["Do trình duyệt web của khách hàng bị lỗi cache","Khách hàng đã xóa phiếu xuất/nhập của lệnh sản xuất hoặc lệnh phân tách, dẫn đến số phiếu bị trống.","Khách hàng chưa nộp tờ khai thuế môn bài.","Khách hàng nhập tiền mặt vượt quá định mức quỹ."], correct:1},
    {q:"Khách hàng muốn sửa đổi số lượng của một Phiếu nhập kho cũ nhưng phần mềm báo lỗi: \"Hàng hoá trong phiếu nhập đã phát sinh xuất kho...\", ĐTV cần hướng dẫn khách xử lý theo thứ tự nào?",
     opts:["Xóa hết các phiếu bán hàng sau đó → Sửa phiếu nhập → Lập lại các phiếu bán hàng","Báo khách hàng không thể sửa được nữa, bắt buộc phải tạo mã hàng mới.","Tắt \"Cảnh báo xuất âm kho\" trong Thiết lập → Sửa phiếu nhập → Tính lại giá vốn → Bật lại cảnh báo xuất âm","Gửi yêu cầu lên Admin kỹ thuật VNPT để can thiệp trực tiếp vào database"], correct:2},
    {q:"Sau khi hướng dẫn khách hàng sửa đổi một loạt chứng từ mua bán cũ từ các tháng trước, ĐTV bắt buộc phải nhắc nhở khách hàng làm gì trước khi xuất báo cáo thuế?",
     opts:["Thực hiện sao lưu dữ liệu ra file Excel và cài lại phần mềm","Đổi mật khẩu tài khoản VNPT HKD để bảo mật thông tin.","Thực hiện chạy lại chức năng \"Tính lại giá vốn\" để cập nhật chính xác giá trị tồn kho mới nhất","Đăng ký mua thêm gói hóa đơn điện tử mới của VNPT."], correct:2},
    {q:"Khi gặp tình huống chứng từ bán hàng đã thanh toán đủ tiền nhưng trên Báo cáo công nợ của khách hàng đó lại hiển thị số tiền âm (báo dư nợ có), ĐTV cần hướng dẫn khách kiểm tra điều gì?",
     opts:["Kiểm tra xem tổng số tiền trên các Phiếu thu liên kết có đang lớn hơn số tiền phải thanh toán trên chứng từ bán hàng hay không (do lập trùng phiếu thu)","Kiểm tra xem khách hàng có đang nợ tiền thuế nhà nước hay không.","Kiểm tra xem khách hàng đã thực hiện xuất hóa đơn điện tử hay chưa","Hướng dẫn khách hàng xóa chứng từ bán hàng đi làm lại từ đầu"], correct:0},
    {q:"Thái độ phục vụ nào sau đây ĐTV tổng đài 18001260 cần tránh khi hỗ trợ các hộ kinh doanh gặp khó khăn về thao tác kế toán?",
     opts:["Lắng nghe kiên nhẫn và đồng cảm với sự bối rối của khách hàng.","Chuyển đổi các thuật ngữ chuyên ngành sang ngôn ngữ đời sống dễ hiểu.","Tỏ thái độ thiếu kiên nhẫn hoặc dùng các câu nói mang tính phán xét như \"Thao tác đơn giản thế này sao anh/chị làm mãi không được?\".","Đồng hành hướng dẫn từng bước nhỏ cho đến khi khách hàng báo cáo khớp số liệu."], correct:2}

};

let currentModule = 'm1';
let SEARCH_INDEX = [];

function normalizeVN(str){
  return (str||'').toString()
    .normalize('NFD').replace(/\p{Mn}/gu,'')
    .replace(/đ/g,'d').replace(/Đ/g,'D')
    .toLowerCase().trim();
}
function stripTags(html){ return (html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' '); }

function buildIndex(){
  const idx = [];
  ['m1','m2','m3'].forEach(mk=>{
    DATA[mk].blocks.forEach((b,i)=>{
      idx.push({module:mk, moduleLabel:DATA[mk].title, kind:'block', id:i,
        snippet:b.h, textN:normalizeVN(b.h+' '+stripTags(b.body))});
    });
  });
  DATA.m4.errors.forEach((e,i)=>{
    idx.push({module:'m4', moduleLabel:'Module IV — Lỗi thường gặp', kind:'error', id:i,
      snippet:e.title, textN:normalizeVN(e.tag+' '+e.title+' '+(e.hien_tuong||[]).join(' ')+' '+e.nguyen_nhan.join(' ')+' '+e.xu_ly.join(' '))});
  });
  DATA.m5.steps.forEach((s,i)=>{
    idx.push({module:'m5', moduleLabel:'Module V — Kịch bản cuộc gọi', kind:'step', id:i,
      snippet:s.t, textN:normalizeVN(s.t+' '+s.d+' '+(s.ex||''))});
  });
  idx.push({module:'m5', moduleLabel:'Module V — Kịch bản cuộc gọi', kind:'attitude', id:0,
    snippet:DATA.m5.attitude.title, textN:normalizeVN(DATA.m5.attitude.title+' '+DATA.m5.attitude.good.join(' ')+' '+DATA.m5.attitude.bad.join(' '))});
  DATA.m6.quiz.forEach((q,i)=>{
    idx.push({module:'m6', moduleLabel:'Module VI — Kiểm tra', kind:'quiz', id:i,
      snippet:q.q, textN:normalizeVN(q.q+' '+q.opts.join(' '))});
  });
  SEARCH_INDEX = idx;
}

function setMode(m){
  document.body.className = 'mode-'+m;
  document.getElementById('btn-gv').classList.toggle('active', m==='gv');
  document.getElementById('btn-dtv').classList.toggle('active', m==='dtv');
}

function gvNoteHTML(gv){
  return `<div class="gv-note">
    <div class="gv-head">Dành cho giảng viên</div>
    <div class="gv-row"><b>Gợi ý giảng dạy</b>${gv.giang}</div>
    <div class="gv-row"><b>Câu hỏi thảo luận</b>${gv.hoi}</div>
    <div class="gv-row"><b>Ý tưởng thực hành</b>${gv.thuchanh}</div>
  </div>`;
}

function showModule(key, filterTerm){
  currentModule = key;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.m===key));
  const d = DATA[key];
  let html = `<div class="module-head">
    <div class="module-eyebrow">${d.eyebrow}</div>
    <h1 class="module-title">${d.title}</h1>
    <p class="module-goal">${d.goal}</p>
    ${gvNoteHTML(d.gv)}
  </div>`;

  if(d.isErrorModule){
    html += `<div class="err-search"><input type="text" id="err-input" placeholder="Gõ hiện tượng lỗi, ví dụ: 'không tìm thấy chứng từ'…" oninput="renderErrors(this.value)" autocomplete="off"></div>
             <div class="err-filterbar" id="err-filterbar"></div>
             <div class="err-count" id="err-count"></div>
             <div id="err-list"></div>`;
    document.getElementById('content').innerHTML = html;
    renderErrFilterBar();
    renderErrors(filterTerm||'');
    return;
  }

  if(d.isCallScript){
    d.steps.forEach((s,i)=>{
      html += `<div class="call-step" data-idx="${i}">
        <div class="step-num">${i+1}</div>
        <div style="flex:1">
          <input type="checkbox" id="cs${i}" style="float:left;margin-right:10px;margin-top:2px;">
          <h4>${s.t}</h4>
          <p>${s.d}</p>
          ${s.ex ? `<div class="example">${s.ex}</div>` : ''}
        </div>
      </div>`;
    });
    html += `<div class="attitude-title">${d.attitude.title}</div>
      <div class="attitude-grid" data-idx="0">
        <div class="attitude-col good"><h5>Nên</h5><ul>${d.attitude.good.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div class="attitude-col bad"><h5>Tránh</h5><ul>${d.attitude.bad.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>`;
    document.getElementById('content').innerHTML = html;
    return;
  }

  if(d.isQuiz){
    d.quiz.forEach((q,i)=>{
      html += `<div class="quiz-q" data-idx="${i}">
        <p class="qtext">${i+1}. ${q.q}</p>
        ${q.opts.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join('')}
      </div>`;
    });
    html += `<button class="btn" onclick="gradeQuiz()">Nộp bài kiểm tra</button>
             <div class="quiz-result" id="quiz-result"></div>`;
    document.getElementById('content').innerHTML = html;
    return;
  }

  d.blocks.forEach((b,i)=>{
    html += `<section class="block" data-idx="${i}"><h3>${b.h}</h3>${b.body}</section>`;
  });
  document.getElementById('content').innerHTML = html;
}

const ERR_GROUP_META = [
  {key:'all', label:'Tất cả'},
  {key:'n1', label:'Nhóm 1 · Chứng từ, công nợ'},
  {key:'n2', label:'Nhóm 2 · Kho, giá vốn'},
  {key:'n3', label:'Nhóm 3 · Ràng buộc & báo cáo âm'},
  {key:'theory', label:'Lý thuyết / FAQ'},
  {key:'other', label:'Kế toán khác'},
  {key:'thue', label:'Thuế'}
];
let currentErrGroup = 'all';

function renderErrFilterBar(){
  const bar = document.getElementById('err-filterbar');
  if(!bar) return;
  const counts = {all: DATA.m4.errors.length};
  DATA.m4.errors.forEach(e=>{ counts[e.group] = (counts[e.group]||0) + 1; });
  bar.innerHTML = ERR_GROUP_META.filter(g=>g.key==='all' || counts[g.key]).map(g=>`
    <button class="err-filter-btn${g.key===currentErrGroup?' active':''}" data-g="${g.key}">${escapeHtml(g.label)} (${counts[g.key]||0})</button>
  `).join('');
  Array.from(bar.children).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentErrGroup = btn.dataset.g;
      renderErrFilterBar();
      const term = document.getElementById('err-input') ? document.getElementById('err-input').value : '';
      renderErrors(term);
    });
  });
}

function renderErrors(term){
  const d = DATA.m4;
  const t = normalizeVN(term);
  const filtered = d.errors.filter(e=>{
    if(currentErrGroup!=='all' && e.group!==currentErrGroup) return false;
    if(!t) return true;
    const hay = normalizeVN(e.tag+' '+e.title+' '+(e.hien_tuong||[]).join(' ')+' '+e.nguyen_nhan.join(' ')+' '+e.xu_ly.join(' '));
    return hay.includes(t);
  });
  const list = document.getElementById('err-list');
  const countEl = document.getElementById('err-count');
  if(!list) return;
  if(countEl) countEl.textContent = `${filtered.length}/${d.errors.length} tình huống`;
  if(filtered.length===0){
    list.innerHTML = `<div class="no-result">Không tìm thấy tình huống lỗi phù hợp. Thử từ khóa khác.</div>`;
    return;
  }
  list.innerHTML = filtered.map(e=>`
    <div class="err-card">
      <span class="tag">${escapeHtml(e.tag)}</span>
      <h4>${escapeHtml(e.title)}</h4>
      ${e.hien_tuong && e.hien_tuong.length ? `
      <div class="lbl">Hiện tượng</div>
      <ul>${e.hien_tuong.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>` : ''}
      ${e.nguyen_nhan.length ? `
      <div class="lbl">Nguyên nhân</div>
      <ul>${e.nguyen_nhan.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>` : ''}
      ${e.xu_ly.length ? `
      <div class="lbl">Hướng xử lý</div>
      ${e.xu_ly_ordered
        ? `<ol>${e.xu_ly.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ol>`
        : `<ul>${e.xu_ly.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`}` : ''}
      ${e.images && e.images.length ? `
      <div class="lbl">Ảnh minh hoạ</div>
      <div class="err-images">${e.images.map(src=>`<img src="${src}" alt="Ảnh minh hoạ thao tác" loading="lazy">`).join('')}</div>` : ''}
    </div>`).join('');
}

function gradeQuiz(){
  const d = DATA.m6.quiz;
  let score = 0;
  d.forEach((q,i)=>{
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    if(sel && parseInt(sel.value)===q.correct) score++;
  });
  const res = document.getElementById('quiz-result');
  res.style.display = 'block';
  res.textContent = `Kết quả: ${score}/${d.length} câu đúng.`;
}

/* ===== GLOBAL SIDEBAR SEARCH ===== */
function onGlobalSearchInput(term){
  const box = document.getElementById('search-results');
  const raw = term.trim();
  if(!raw){ box.classList.remove('show'); box.innerHTML=''; return; }
  const t = normalizeVN(raw);
  const matches = SEARCH_INDEX.filter(e=>e.textN.includes(t)).slice(0,8);
  if(matches.length===0){
    box.innerHTML = `<div class="search-empty">Không tìm thấy nội dung phù hợp.</div>`;
    box.classList.add('show');
    return;
  }
  box.innerHTML = matches.map((m,i)=>`
    <div class="search-result-item" data-i="${i}">
      <div class="srm">${m.moduleLabel}</div>
      <div class="srs">${escapeHtml(m.snippet)}</div>
    </div>`).join('');
  box.classList.add('show');
  Array.from(box.children).forEach((el,i)=>{
    el.addEventListener('click', ()=> navigateToResult(matches[i], raw));
  });
}
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function navigateToResult(entry, rawTerm){
  const box = document.getElementById('search-results');
  box.classList.remove('show');
  if(entry.module==='m4'){
    showModule('m4', rawTerm);
    return;
  }
  showModule(entry.module);
  requestAnimationFrame(()=>{
    let sel = null;
    if(entry.kind==='block') sel = `.block[data-idx="${entry.id}"]`;
    else if(entry.kind==='step') sel = `.call-step[data-idx="${entry.id}"]`;
    else if(entry.kind==='attitude') sel = `.attitude-grid[data-idx="${entry.id}"]`;
    else if(entry.kind==='quiz') sel = `.quiz-q[data-idx="${entry.id}"]`;
    if(!sel) return;
    const el = document.querySelector(sel);
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add('flash');
      setTimeout(()=>el.classList.remove('flash'), 1600);
    }
  });
}
document.addEventListener('click', (ev)=>{
  const box = document.getElementById('search-results');
  const wrap = document.querySelector('.rail-search');
  if(wrap && !wrap.contains(ev.target)){ box.classList.remove('show'); }
});

buildIndex();
showModule('m1');
</script>
